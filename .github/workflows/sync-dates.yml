name: Sync Pipeline Dates

on:
  workflow_dispatch:        # lets you trigger it manually too, from the Actions tab

permissions:
  contents: write           # needed to commit grm-data.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run date sync + map data export
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: node sync.js
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grm-data.json
          if git diff --staged --quiet; then
            echo "No map data changes to commit."
            exit 0
          fi
          git commit -m "Update map data"
          # Push, but if another concurrent run pushed first, rebase on top and retry.
          # This prevents harmless "failed to push some refs" errors from failing the job.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed map data (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — another run pushed first; rebasing and retrying."
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "Could not push map data after 5 attempts; the next run will carry it. Not failing the job."
          exit 0
