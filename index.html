<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRM Project Kickoff</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #14151f;
    color: #fff;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #1a1d29;
    border-radius: 14px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
    border: 1px solid #2a2d3d;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .sub { color: #9699a6; font-size: 13px; margin-bottom: 24px; }
  label { font-size: 13px; color: #c5c7d0; font-weight: 600; display: block; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input[type="text"], input[type="date"], input[type="password"], select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #33364a;
    background: #23263a;
    color: #fff;
    font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #579bfc; }
  button.submit {
    width: 100%; padding: 13px; border-radius: 8px; border: none;
    background: #00c875; color: #fff; font-weight: 700; font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }
  button.submit:disabled { background: #33364a; cursor: not-allowed; }
  button.submit:hover:not(:disabled) { background: #00b368; }
  .token-box {
    background: #23263a; border: 1px solid #33364a; border-radius: 8px;
    padding: 14px; margin-bottom: 20px; font-size: 12px; color: #9699a6;
  }
  #status { margin-top: 16px; font-size: 13px; white-space: pre-line; }
  .ok { color: #00c875; }
  .err { color: #ff5c72; }
  .working { color: #fdab3d; }
  #resultLink { display: none; margin-top: 14px; }
  #resultLink a {
    display: block; text-align: center; background: #579bfc; color: #fff;
    padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🚀 GRM Project Kickoff</h1>
  <div class="sub">Clones the exact structure of "NEW PROJECT TEMPLATE - BEN DO NOT CHANGE TIMES" into a new project board.</div>

  <div class="token-box">
    <label style="margin-bottom:8px;">monday.com API Token</label>
    <input type="password" id="apiToken" placeholder="Paste your personal API token" />
    <div style="margin-top:8px;">Stored only in this browser.</div>
  </div>

  <div class="field">
    <label>Select from Project Pipeline</label>
    <select id="pipelinePicker">
      <option value="">Loading pipeline projects...</option>
    </select>
  </div>

  <div class="field">
    <label>Project Name</label>
    <input type="text" id="projectName" placeholder="Auto-filled from pipeline" readonly style="opacity:0.7;" />
  </div>

  <div class="field">
    <label>Address</label>
    <input type="text" id="address" placeholder="Auto-filled from pipeline" readonly style="opacity:0.7;" />
  </div>

  <div class="field">
    <label>Client</label>
    <input type="text" id="client" value="GRM" />
  </div>

  <div class="field">
    <label>Planning Authority</label>
    <input type="text" id="planningAuthority" placeholder="e.g. Bristol City Council" />
  </div>

  <div class="field">
    <label>Start Date</label>
    <input type="date" id="startDate" />
  </div>

  <button class="submit" id="submitBtn">Create Project Board</button>
  <div id="status"></div>
  <div id="resultLink"><a id="boardLink" href="#" target="_blank">Open New Board →</a></div>
</div>

<script>
const WORKSPACE_ID = 16085486;
const PIPELINE_BOARD_ID = 18419311248;
const TEMPLATE_BOARD_ID = 18423661718; // NEW PROJECT TEMPLATE - BEN DO NOT CHANGE TIMES
const PIPELINE_ADDRESS_COL = "text_mm4n4axw";

document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

const savedToken = localStorage.getItem('monday_api_token');
if (savedToken) document.getElementById('apiToken').value = savedToken;

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

async function mondayCall(token, query, variables) {
  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({ query, variables })
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

let pipelineItems = [];

async function loadPipelineItems() {
  const token = document.getElementById('apiToken').value.trim();
  const picker = document.getElementById('pipelinePicker');
  if (!token) { picker.innerHTML = '<option value="">Paste your API token first</option>'; return; }
  picker.innerHTML = '<option value="">Loading pipeline projects...</option>';
  try {
    const data = await mondayCall(token, `
      query($boardId: ID!) {
        boards(ids: [$boardId]) {
          items_page(limit: 100) {
            items { id name column_values(ids: ["${PIPELINE_ADDRESS_COL}"]) { id text } }
          }
        }
      }`, { boardId: PIPELINE_BOARD_ID });
    pipelineItems = data.boards[0].items_page.items;
    picker.innerHTML = '<option value="">-- Select a project --</option>' +
      pipelineItems.map(it => `<option value="${it.id}">${it.name}</option>`).join('');
    const params = new URLSearchParams(window.location.search);
    const preselectId = params.get('item');
    if (preselectId) { picker.value = preselectId; picker.dispatchEvent(new Event('change')); }
  } catch (e) {
    picker.innerHTML = '<option value="">Failed to load — check token</option>';
  }
}

document.getElementById('apiToken').addEventListener('blur', loadPipelineItems);
if (savedToken) loadPipelineItems();

document.getElementById('pipelinePicker').addEventListener('change', (e) => {
  const item = pipelineItems.find(it => it.id === e.target.value);
  if (!item) { document.getElementById('projectName').value = ''; document.getElementById('address').value = ''; return; }
  document.getElementById('projectName').value = item.name;
  const addressCol = item.column_values.find(c => c.id === PIPELINE_ADDRESS_COL);
  document.getElementById('address').value = addressCol ? addressCol.text : '';
});

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const token = document.getElementById('apiToken').value.trim();
  const projectName = document.getElementById('projectName').value.trim();
  const address = document.getElementById('address').value.trim();
  const client = document.getElementById('client').value.trim();
  const planningAuthority = document.getElementById('planningAuthority').value.trim();
  const startDate = document.getElementById('startDate').value;

  if (!token) { setStatus('Please paste your monday.com API token.', 'err'); return; }
  if (!projectName) { setStatus('Please enter a project name.', 'err'); return; }

  localStorage.setItem('monday_api_token', token);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('resultLink').style.display = 'none';

  try {
    setStatus('Reading master template structure...', 'working');
    const schema = await mondayCall(token, `
      { boards(ids: [${TEMPLATE_BOARD_ID}]) {
          columns { id title type }
          groups { id title }
        } }`);
    const templateColumns = schema.boards[0].columns.filter(c => c.type !== 'name' && c.type !== 'subtasks');
    const templateGroups = schema.boards[0].groups;

    // Pull every item (with subitems) from the template, grouped
    let allItems = [];
    let cursor = null;
    do {
      const data = await mondayCall(token, `
        query($cursor: String) {
          boards(ids: [${TEMPLATE_BOARD_ID}]) {
            items_page(limit: 100, cursor: $cursor) {
              cursor
              items {
                id name
                group { id title }
                column_values { id type text value }
                subitems { id name column_values { id type text value } }
              }
            }
          }
        }`, { cursor });
      const page = data.boards[0].items_page;
      allItems = allItems.concat(page.items);
      cursor = page.cursor;
    } while (cursor);

    setStatus('Creating new board...', 'working');
    const boardData = await mondayCall(token, `
      mutation($name: String!, $ws: ID!) {
        create_board(board_name: $name, board_kind: public, workspace_id: $ws) { id }
      }`, { name: projectName, ws: WORKSPACE_ID });
    const boardId = boardData.create_board.id;

    setStatus('Creating matching columns...', 'working');
    const colIdMap = {}; // template col id -> new board col id
    for (const col of templateColumns) {
      const d = await mondayCall(token, `
        mutation($boardId: ID!, $title: String!, $type: ColumnType!) {
          create_column(board_id: $boardId, title: $title, column_type: $type) { id }
        }`, { boardId, title: col.title, type: col.type });
      colIdMap[col.id] = d.create_column.id;
    }
    const textColId = colIdMap[templateColumns.find(c => c.type === 'text')?.id];
    const timelineColId = colIdMap[templateColumns.find(c => c.type === 'timeline')?.id];
    const depColTemplateId = templateColumns.find(c => c.type === 'dependency')?.id;
    const depColId = depColTemplateId ? colIdMap[depColTemplateId] : null;

    setStatus('Creating groups...', 'working');
    const groupIdMap = {};
    for (const g of templateGroups) {
      const d = await mondayCall(token, `
        mutation($boardId: ID!, $name: String!) {
          create_group(board_id: $boardId, group_name: $name) { id }
        }`, { boardId, name: g.title });
      groupIdMap[g.id] = d.create_group.id;
    }

    // Work out earliest date across the whole template so we can shift everything
    // relative to the new start date while preserving spacing between tasks.
    let earliestTemplateDate = null;
    allItems.forEach(item => {
      const tl = item.column_values.find(c => c.id === Object.keys(colIdMap).find(k => colIdMap[k] === timelineColId));
      if (tl && tl.text) {
        const from = tl.text.split(' - ')[0];
        if (from && (!earliestTemplateDate || from < earliestTemplateDate)) earliestTemplateDate = from;
      }
    });

    setStatus('Building project sections...', 'working');
    const itemIdMap = {}; // template item id -> new item id
    for (const item of allItems) {
      const newGroupId = groupIdMap[item.group.id];
      const colVals = {};

      // Copy every column value from the template item as-is (status, people, etc.)
      for (const col of templateColumns) {
        if (col.type === 'timeline' || col.type === 'dependency') continue; // handled separately below/after
        const newColId = colIdMap[col.id];
        const srcVal = item.column_values.find(c => c.id === col.id);
        if (col.type === 'text' && item.name === 'Client') { colVals[newColId] = client || 'GRM'; continue; }
        if (col.type === 'text' && item.name === 'Planning Authority') { colVals[newColId] = planningAuthority || 'TBC'; continue; }
        if (col.type === 'text' && item.name === 'Address') { colVals[newColId] = address || 'TBC'; continue; }
        if (srcVal && srcVal.value) {
          try { colVals[newColId] = JSON.parse(srcVal.value); } catch (e) { /* skip unparseable */ }
        }
      }

      // Shift timeline relative to new start date
      const tlColTemplateId = Object.keys(colIdMap).find(k => colIdMap[k] === timelineColId);
      const tl = item.column_values.find(c => c.id === tlColTemplateId);
      if (tl && tl.text && earliestTemplateDate && timelineColId) {
        const [from, to] = tl.text.split(' - ');
        const offsetFromStart = (new Date(from) - new Date(earliestTemplateDate)) / 86400000;
        const duration = (new Date(to) - new Date(from)) / 86400000;
        const newFrom = addDays(startDate, offsetFromStart);
        const newTo = addDays(newFrom, duration);
        colVals[timelineColId] = { from: newFrom, to: newTo };
      }

      const d = await mondayCall(token, `
        mutation($boardId: ID!, $groupId: String!, $name: String!, $colVals: JSON!) {
          create_item(board_id: $boardId, group_id: $groupId, item_name: $name, column_values: $colVals) { id }
        }`, { boardId, groupId: newGroupId, name: item.name, colVals: JSON.stringify(colVals) });
      itemIdMap[item.id] = d.create_item.id;

      // Replicate subitems
      for (const sub of (item.subitems || [])) {
        await mondayCall(token, `
          mutation($parentId: ID!, $name: String!) {
            create_subitem(parent_item_id: $parentId, item_name: $name) { id }
          }`, { parentId: d.create_item.id, name: sub.name });
      }
    }

    // Second pass: now that every item exists, wire up dependencies
    if (depColId) {
      setStatus('Linking dependencies...', 'working');
      for (const item of allItems) {
        const depCol = item.column_values.find(c => c.id === depColTemplateId);
        if (!depCol || !depCol.value) continue;
        let parsed;
        try { parsed = JSON.parse(depCol.value); } catch (e) { continue; }
        const linkedIds = (parsed.linkedPulseIds || []).map(l => l.linkedPulseId);
        const newLinkedIds = linkedIds.map(id => itemIdMap[id]).filter(Boolean);
        if (newLinkedIds.length === 0) continue;
        const newDepVal = { linkedPulseIds: newLinkedIds.map(id => ({ linkedPulseId: parseInt(id) })) };
        await mondayCall(token, `
          mutation($boardId: ID!, $itemId: ID!, $val: JSON!) {
            change_column_value(board_id: $boardId, item_id: $itemId, column_id: "${depColId}", value: $val) { id }
          }`, { boardId, itemId: itemIdMap[item.id], val: JSON.stringify(newDepVal) });
      }
    }

    setStatus('✅ Board created successfully!', 'ok');
    const link = document.getElementById('boardLink');
    link.href = `https://vitaarchitecture.monday.com/boards/${boardId}`;
    document.getElementById('resultLink').style.display = 'block';

  } catch (e) {
    setStatus('❌ Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
