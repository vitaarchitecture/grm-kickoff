<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRM Project Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRM Map">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #14151f;
    color: #fff;
    margin: 0;
    padding: 16px;
  }
  .token-box {
    background: #1a1d29; border: 1px solid #2a2d3d; border-radius: 8px;
    padding: 12px; margin-bottom: 12px; font-size: 12px; color: #9699a6;
  }
  input[type="password"] {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #33364a;
    background: #23263a; color: #fff; font-size: 13px; margin-top: 6px;
  }
  input:focus { outline: none; border-color: #579bfc; }
  .legend { font-size: 12px; color: #9699a6; margin-bottom: 10px; }
  #status { font-size: 12px; margin-bottom: 10px; }
  .ok { color: #00c875; }
  .err { color: #ff5c72; }
  .working { color: #fdab3d; }
  #map { height: calc(100vh - 140px); min-height: 400px; border-radius: 8px; }
  button {
    padding: 8px 14px; border-radius: 6px; border: none; background: #579bfc;
    color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 10px;
  }
  button:disabled { background: #33364a; cursor: not-allowed; }
</style>
</head>
<body>

<div class="token-box" id="tokenBox">
  <label>monday.com API Token</label>
  <div style="margin: 6px 0 8px 0; line-height:1.5;">📋 <b>How to get your token:</b> monday.com → click your avatar → Admin (or Developers) → API → copy your Personal API Token, then paste it below. It's stored only in your browser, never sent anywhere else.</div>
  <input type="password" id="apiToken" placeholder="Paste your personal API token" />
</div>

<div class="legend">🔴 High Risk &nbsp; 🟢 Priority Score 4+ &nbsp; 🟠 Priority Score 0-3</div>
<button id="loadMapBtn">Reload Map</button>
<div id="status"></div>
<div id="map"></div>

<script>
const PIPELINE_BOARD_ID = 18419311248;
const PIPELINE_ADDRESS_COL = "text_mm4n4axw";
const PRIORITY_SCORE_COL = "formula_mm5yktnh";
const HIGH_RISK_GROUP_ID = "group_mm5j7ex7";
let leafletMap = null;

const savedToken = localStorage.getItem('monday_api_token');
if (savedToken) {
  document.getElementById('apiToken').value = savedToken;
  document.getElementById('tokenBox').style.display = 'none';
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

async function mondayCall(token, query, variables) {
  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({ query, variables })
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

// --- Google Plus Code handling ---
// Full precise OLC decoding needs the complete code; short codes like "PCPJ+RFF Exeter"
// are missing their leading digits and can only be fully recovered with Google's own
// geocoding API (paid). As a free, no-key alternative, we resolve short Plus Codes to
// their locality's coordinates instead — accurate to the town/area, not the exact plot,
// which is sufficient for a project overview map.
function isPlusCode(str) {
  return /^[23456789CFGHJMPQRVWXcfghjmpqrvwx]{2,8}\+[23456789CFGHJMPQRVWXcfghjmpqrvwx]{0,3}$/.test(str.trim());
}

async function resolvePlusCodeAddress(fullAddress) {
  const parts = fullAddress.split(',')[0].trim().split(' ');
  const codepart = parts.find(p => isPlusCode(p));
  if (!codepart) return null;
  const localityPart = fullAddress.replace(codepart, '').trim();
  if (!localityPart) return null;
  return await geocodeAddress(localityPart + ', UK');
}
// --- end Plus Code handling ---

async function geocodeAddress(address) {
  const cacheKey = 'geocode_' + address;
  const cached = localStorage.getItem(cacheKey);
  if (cached) return JSON.parse(cached);
  const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=1&q=${encodeURIComponent(address)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.length === 0) return null;
  const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  localStorage.setItem(cacheKey, JSON.stringify(coords));
  return coords;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function loadMap() {
  const token = document.getElementById('apiToken').value.trim();
  if (!token) { setStatus('Please paste your monday.com API token.', 'err'); return; }
  localStorage.setItem('monday_api_token', token);
  document.getElementById('tokenBox').style.display = 'none';

  const btn = document.getElementById('loadMapBtn');
  btn.disabled = true;

  try {
    setStatus('Fetching Pipeline projects...', 'working');
    const data = await mondayCall(token, `
      query($boardId: ID!) {
        boards(ids: [$boardId]) {
          items_page(limit: 100) {
            items {
              name
              group { id }
              column_values(ids: ["${PIPELINE_ADDRESS_COL}"]) { id text }
              score: column_values(ids: ["${PRIORITY_SCORE_COL}"]) { id ... on FormulaValue { display_value } }
            }
          }
        }
      }`, { boardId: PIPELINE_BOARD_ID });
    const items = data.boards[0].items_page.items;

    if (!leafletMap) {
      leafletMap = L.map('map').setView([54.5, -3.5], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);
    } else {
      leafletMap.eachLayer(layer => { if (layer instanceof L.CircleMarker) leafletMap.removeLayer(layer); });
    }

    let plotted = 0, skipped = 0;
    const skipReasons = [];
    for (const item of items) {
      const addressVal = item.column_values.find(c => c.id === PIPELINE_ADDRESS_COL);
      const address = addressVal && addressVal.text;
      if (!address) { skipped++; skipReasons.push(`${item.name}: no address`); continue; }

      const scoreVal = item.score.find(c => c.id === PRIORITY_SCORE_COL);
      const score = scoreVal && scoreVal.display_value ? parseFloat(scoreVal.display_value) : 0;
      const isHighRisk = item.group.id === HIGH_RISK_GROUP_ID;

      let color = '#fdab3d';
      if (isHighRisk) color = '#df2f4a';
      else if (score >= 4) color = '#00c875';

      setStatus(`Geocoding "${item.name}"... (${plotted} plotted so far)`, 'working');
      try {
        let coords;
        const addressParts = address.split(' ');
        const hasPlusCode = addressParts.some(p => isPlusCode(p));
        if (hasPlusCode) {
          coords = await resolvePlusCodeAddress(address);
        } else {
          coords = await geocodeAddress(address + ', UK');
        }
        if (!coords) { skipped++; skipReasons.push(`${item.name}: address not found`); await sleep(1100); continue; }

        L.circleMarker([coords.lat, coords.lng], {
          radius: 9, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9
        }).addTo(leafletMap).bindPopup(`<b>${item.name}</b><br>Score: ${score}${isHighRisk ? '<br><span style="color:#df2f4a">⚠ High Risk</span>' : ''}`);
        plotted++;
      } catch (geoErr) {
        skipped++;
        skipReasons.push(`${item.name}: ${geoErr.message}`);
      }
      await sleep(1100);
    }

    console.log('Skip reasons:', skipReasons);
    setStatus(`✅ Plotted ${plotted} project(s).${skipped > 0 ? ' ' + skipped + ' skipped.' : ''}`, 'ok');
  } catch (e) {
    setStatus('❌ Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('loadMapBtn').addEventListener('click', loadMap);
if (savedToken) loadMap();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
