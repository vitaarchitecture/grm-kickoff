<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRM Project Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #14151f;
    color: #fff;
    margin: 0;
    padding: 16px;
  }
  .token-box {
    background: #1a1d29; border: 1px solid #2a2d3d; border-radius: 8px;
    padding: 12px; margin-bottom: 12px; font-size: 12px; color: #9699a6;
  }
  input[type="password"] {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #33364a;
    background: #23263a; color: #fff; font-size: 13px; margin-top: 6px;
  }
  input:focus { outline: none; border-color: #579bfc; }
  .legend { font-size: 12px; color: #9699a6; margin-bottom: 10px; }
  #status { font-size: 12px; margin-bottom: 10px; }
  .ok { color: #00c875; }
  .err { color: #ff5c72; }
  .working { color: #fdab3d; }
  #map { height: calc(100vh - 140px); min-height: 400px; border-radius: 8px; }
  button {
    padding: 8px 14px; border-radius: 6px; border: none; background: #579bfc;
    color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 10px;
  }
  button:disabled { background: #33364a; cursor: not-allowed; }
</style>
</head>
<body>

<div class="token-box" id="tokenBox">
  <label>monday.com API Token</label>
  <div style="margin: 6px 0 8px 0; line-height:1.5;">📋 <b>How to get your token:</b> monday.com → click your avatar → Admin (or Developers) → API → copy your Personal API Token, then paste it below. It's stored only in your browser, never sent anywhere else.</div>
  <input type="password" id="apiToken" placeholder="Paste your personal API token" />
</div>

<div class="legend">🔴 High Risk &nbsp; 🟢 Priority Score 4+ &nbsp; 🟠 Priority Score 0-3</div>
<button id="loadMapBtn">Reload Map</button>
<div id="status"></div>
<div id="map"></div>

<script>
const PIPELINE_BOARD_ID = 18419311248;
const PIPELINE_ADDRESS_COL = "text_mm4n4axw";
const PRIORITY_SCORE_COL = "formula_mm5jc7v3";
const HIGH_RISK_GROUP_ID = "group_mm5j7ex7";
let leafletMap = null;

const savedToken = localStorage.getItem('monday_api_token');
if (savedToken) {
  document.getElementById('apiToken').value = savedToken;
  document.getElementById('tokenBox').style.display = 'none';
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

async function mondayCall(token, query, variables) {
  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': token },
    body: JSON.stringify({ query, variables })
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// --- Open Location Code (Google "plus code") support ------------------------
// Site addresses on the Pipeline board are plus codes, e.g. "49RQ+GPR Matlock".
// These are far more precise than a street address or postcode, but Nominatim
// cannot resolve them at all. Short codes have their first 4 characters
// trimmed, so we geocode the locality ("Matlock") for a reference point,
// recover the full code from it, then decode to exact coordinates locally.
const OLC_ALPHABET = '23456789CFGHJMPQRVWX';
const OLC_SEP_POS = 8;
const OLC_PAIR_RES = [20, 1, 0.05, 0.0025, 0.000125];
const OLC_GRID_ROWS = 5, OLC_GRID_COLS = 4;
const OLC_RE = new RegExp('^([' + OLC_ALPHABET + ']{2,8}\\+[' + OLC_ALPHABET + ']{2,3})\\s*(.*)$', 'i');

function olcDecode(code) {
  const d = code.replace('+', '').replace(/0+$/, '').toUpperCase();
  let lat = -90, lng = -180, latRes = 20, lngRes = 20, i = 0;
  for (; i < Math.min(d.length, 10); i += 2) {
    const res = OLC_PAIR_RES[i / 2];
    lat += OLC_ALPHABET.indexOf(d[i]) * res;
    lng += OLC_ALPHABET.indexOf(d[i + 1]) * res;
    latRes = res; lngRes = res;
  }
  for (; i < Math.min(d.length, 15); i++) {           // grid refinement digits
    const v = OLC_ALPHABET.indexOf(d[i]);
    latRes /= OLC_GRID_ROWS; lngRes /= OLC_GRID_COLS;
    lat += Math.floor(v / OLC_GRID_COLS) * latRes;
    lng += (v % OLC_GRID_COLS) * lngRes;
  }
  return { lat: lat + latRes / 2, lng: lng + lngRes / 2 };  // cell centre
}

function olcEncodePrefix(lat, lng, n) {
  let la = lat + 90, ln = lng + 180, out = '';
  for (let i = 0; i < n / 2; i++) {
    const res = OLC_PAIR_RES[i];
    const latD = Math.floor(la / res), lngD = Math.floor(ln / res);
    out += OLC_ALPHABET[latD] + OLC_ALPHABET[lngD];
    la -= latD * res; ln -= lngD * res;
  }
  return out;
}

function olcRecoverNearest(short, refLat, refLng) {
  const padding = OLC_SEP_POS - short.indexOf('+');
  if (padding <= 0) return olcDecode(short);          // already a full code
  const resolution = Math.pow(20, 2 - padding / 2), half = resolution / 2;
  let { lat, lng } = olcDecode(olcEncodePrefix(refLat, refLng, padding) + short);
  if (refLat + half < lat && lat - resolution >= -90) lat -= resolution;
  else if (refLat - half > lat && lat + resolution <= 90) lat += resolution;
  if (refLng + half < lng && lng - resolution >= -180) lng -= resolution;
  else if (refLng - half > lng && lng + resolution <= 180) lng += resolution;
  return { lat, lng };
}

// Nominatim permits 1 request/sec, so real network calls are spaced out here
// rather than by the caller — cached and plus-code lookups then cost nothing.
let lastNominatimCall = 0;
async function nominatimLookup(query) {
  const cacheKey = 'geocode_' + query;
  const cached = localStorage.getItem(cacheKey);
  if (cached) return JSON.parse(cached);

  const wait = 1100 - (Date.now() - lastNominatimCall);
  if (wait > 0) await sleep(wait);
  lastNominatimCall = Date.now();

  const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=1&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.length === 0) return null;
  const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  localStorage.setItem(cacheKey, JSON.stringify(coords));
  return coords;
}

// Accepts a plus code ("49RQ+GPR Matlock"), a postcode ("PA16 0AL"), or any
// free-text address. Returns { lat, lng } or null.
async function geocodeAddress(address) {
  const plus = address.match(OLC_RE);
  if (!plus) return nominatimLookup(address + ', UK');

  const short = plus[1].toUpperCase();
  const locality = plus[2].trim();
  if (OLC_SEP_POS - short.indexOf('+') <= 0) return olcDecode(short);
  if (!locality) return null;         // short code with no reference locality
  const ref = await nominatimLookup(locality + ', UK');
  if (!ref) return null;
  return olcRecoverNearest(short, ref.lat, ref.lng);
}

async function loadMap() {
  const token = document.getElementById('apiToken').value.trim();
  if (!token) { setStatus('Please paste your monday.com API token.', 'err'); return; }
  localStorage.setItem('monday_api_token', token);
  document.getElementById('tokenBox').style.display = 'none';

  const btn = document.getElementById('loadMapBtn');
  btn.disabled = true;

  try {
    setStatus('Fetching Pipeline projects...', 'working');
    const data = await mondayCall(token, `
      query($boardId: ID!) {
        boards(ids: [$boardId]) {
          items_page(limit: 100) {
            items {
              name
              group { id }
              column_values(ids: ["${PIPELINE_ADDRESS_COL}"]) { id text }
              score: column_values(ids: ["${PRIORITY_SCORE_COL}"]) { id ... on FormulaValue { display_value } }
            }
          }
        }
      }`, { boardId: PIPELINE_BOARD_ID });
    const items = data.boards[0].items_page.items;

    if (!leafletMap) {
      leafletMap = L.map('map').setView([54.5, -3.5], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);
    } else {
      leafletMap.eachLayer(layer => { if (layer instanceof L.CircleMarker) leafletMap.removeLayer(layer); });
    }

    let plotted = 0, skipped = 0;
    const skipReasons = [];
    for (const item of items) {
      const addressVal = item.column_values.find(c => c.id === PIPELINE_ADDRESS_COL);
      const address = addressVal && addressVal.text;
      if (!address) { skipped++; skipReasons.push(`${item.name}: no address`); continue; }

      const scoreVal = item.score.find(c => c.id === PRIORITY_SCORE_COL);
      const score = scoreVal && scoreVal.display_value ? parseFloat(scoreVal.display_value) : 0;
      const isHighRisk = item.group.id === HIGH_RISK_GROUP_ID;

      let color = '#fdab3d';
      if (isHighRisk) color = '#df2f4a';
      else if (score >= 4) color = '#00c875';

      setStatus(`Locating "${item.name}"... (${plotted} plotted so far)`, 'working');
      try {
        const coords = await geocodeAddress(address);
        if (!coords) { skipped++; skipReasons.push(`${item.name}: address not found ("${address}")`); continue; }

        L.circleMarker([coords.lat, coords.lng], {
          radius: 9, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9
        }).addTo(leafletMap).bindPopup(`<b>${item.name}</b><br>${address}<br>Score: ${score}${isHighRisk ? '<br><span style="color:#df2f4a">⚠ High Risk</span>' : ''}`);
        plotted++;
      } catch (geoErr) {
        skipped++;
        skipReasons.push(`${item.name}: ${geoErr.message}`);
      }
    }

    console.log('Skip reasons:', skipReasons);
    setStatus(`✅ Plotted ${plotted} project(s).${skipped > 0 ? ' ' + skipped + ' skipped.' : ''}`, 'ok');
  } catch (e) {
    setStatus('❌ Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('loadMapBtn').addEventListener('click', loadMap);
if (savedToken) loadMap();
</script>
</body>
</html>
