<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GRM Project Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRM Map">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #14151f; color: #e6e7ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 10px 14px; background: #1b1c28; border-bottom: 1px solid #2a2b3a; }
  .title { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: #b9bbcc; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 5px; vertical-align: -1px; }
  .dot.red { background: #e2445c; }
  .dot.green { background: #00c875; }
  .dot.orange { background: #fdab3d; }
  #reload { background: #0073ea; color: #fff; border: 0; border-radius: 6px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #reload:hover { background: #0060c2; }
  #updated { font-size: 11.5px; color: #7e8098; }
  #status { font-size: 12.5px; }
  #status.err { color: #e2445c; }
  #status.warn { color: #fdab3d; }
  #map { position: absolute; top: var(--header-h, 54px); bottom: 0; left: 0; right: 0;
    background: #14151f; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #22233299;
    background: #222332; color: #e6e7ee; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12.5px; line-height: 1.55; }
  .pop-title { font-weight: 700; font-size: 13px; margin-bottom: 5px; }
  .pop a { color: #6fb2ff; text-decoration: none; }
  .pop a:hover { text-decoration: underline; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
<header id="hdr">
  <span class="title">GRM Project Map</span>
  <span class="legend">
    <span><span class="dot red"></span>High Risk</span>
    <span><span class="dot green"></span>Priority Score 4+</span>
    <span><span class="dot orange"></span>Priority Score 0-3</span>
  </span>
  <button id="reload">Reload Map</button>
  <span id="updated"></span>
  <span id="status"></span>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Data comes from grm-data.json, written hourly by the Sync Pipeline Dates
  // GitHub Action. Same origin as this page, so no CORS and no API token.

  function sizeMap() {
    document.documentElement.style.setProperty('--header-h',
      document.getElementById('hdr').offsetHeight + 'px');
  }
  window.addEventListener('resize', sizeMap);
  sizeMap();

  const map = L.map('map').setView([54.5, -3.5], 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  const layer = L.layerGroup().addTo(map);

  function colourFor(item) {
    if ((item.grm_status || '').toLowerCase() === 'do not proceed') return '#e2445c';
    if (item.priority != null && item.priority >= 4) return '#00c875';
    return '#fdab3d';
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function load() {
    const status = document.getElementById('status');
    status.textContent = 'Loading\u2026';
    status.className = '';
    try {
      const res = await fetch('./grm-data.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) {
        if (res.status === 404) {
          status.textContent = 'No data yet \u2014 run the "Sync Pipeline Dates" action once, then reload.';
          status.className = 'err';
          return;
        }
        throw new Error('HTTP ' + res.status);
      }
      const data = await res.json();
      layer.clearLayers();

      const pts = [];
      for (const it of (data.items || [])) {
        if (it.lat == null || it.lng == null) continue;
        const c = colourFor(it);
        const mk = L.circleMarker([it.lat, it.lng], {
          radius: 9, color: '#fff', weight: 1.5, fillColor: c, fillOpacity: 0.9
        }).addTo(layer);

        const rows = [];
        if (it.priority != null) rows.push('Priority score: <b>' + esc(it.priority) + '</b>');
        if (it.grm_status) rows.push('GRM status: <b>' + esc(it.grm_status) + '</b>');
        if (it.client) rows.push('Client: ' + esc(it.client));
        if (it.start_date && it.end_date)
          rows.push('Programme: ' + esc(it.start_date) + ' \u2192 ' + esc(it.end_date));

        const links = [];
        if (it.board_url)
          links.push('<a href="' + esc(it.board_url) + '" target="_blank" rel="noopener">monday board</a>');
        if (it.site_review_url)
          links.push('<a href="' + esc(it.site_review_url) + '" target="_blank" rel="noopener">site review</a>');

        mk.bindPopup('<div class="pop"><div class="pop-title">' + esc(it.name) + '</div>'
          + rows.join('<br>')
          + (links.length ? '<br>' + links.join(' \u00b7 ') : '')
          + '</div>');
        pts.push([it.lat, it.lng]);
      }

      if (pts.length) map.fitBounds(pts, { padding: [40, 40] });

      const skipped = (data.items || []).filter(i => i.lat == null).length;
      document.getElementById('updated').textContent = data.generated_at
        ? 'Updated ' + new Date(data.generated_at).toLocaleString() : '';
      status.textContent = skipped ? skipped + ' site(s) missing location' : '';
      status.className = skipped ? 'warn' : '';
    } catch (e) {
      status.textContent = 'Error: ' + e.message;
      status.className = 'err';
    }
  }

  document.getElementById('reload').addEventListener('click', load);
  load();
</script>
</body>
</html>
